[project]
name = "video-compression"
version = "0.1.0"
description = "Bilevel Semantic Rate-Distortion Optimization (SRDO) — analysis phases 0-2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "tqdm>=4.66",
    "torch>=2.3",
    "torchvision>=0.18",
    "ultralytics>=8.3",
    "scikit-learn>=1.5",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.2", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srdo"]
